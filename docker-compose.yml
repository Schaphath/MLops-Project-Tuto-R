services:

  # API de scoring — Plumber / XGBoost
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: churn-api:1.3.0
    container_name: telco-churn-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TZ: "Europe/Paris"
    volumes:
      # Montage des artefacts en lecture seule : permet de mettre à jour
      # le modèle sans reconstruire l'image.
      - ./api/models:/app/models:ro
    networks:
      - churn-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Client Shiny — Interface utilisateur
  shiny:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: interface-shiny:1.3.0
    container_name: telco-churn-interface
    restart: unless-stopped
    ports:
      - "3838:3838"
    environment:
      API_URL: "http://api:8080"
      TZ: "Europe/Paris"
    networks:
      - churn-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3838/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  churn-net:
    driver: bridge
    name: churn-network
    