services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: churn-api:${APP_VERSION:-latest}
    container_name: telco-churn-api
    restart: unless-stopped
    expose:
      - "${API_PORT}"
    environment:
      TZ: "${TIMEZONE}"
    volumes:
      # Montage des artefacts en lecture seule : permet de mettre à jour
      # le modèle sans reconstruire l'image.
      - ./api/models:/app/models:ro
    networks:
      - churn-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_PORT}/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  shiny:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: interface-shiny:${APP_VERSION:-latest}
    container_name: telco-churn-interface
    restart: unless-stopped
    ports:
      - "${SHINY_PORT}:${SHINY_PORT}"
    environment:
      API_URL: "http://api:${API_PORT}"
      TZ: "${TIMEZONE}"
    networks:
      - churn-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${SHINY_PORT}/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  churn-net:
    driver: bridge
    name: churn-network