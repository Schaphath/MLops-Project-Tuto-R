name: CI/CD Pipeline - Telco Churn

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---------------------------------------------------
  # JOB 1 : Validation de la syntaxe Docker Compose
  # ---------------------------------------------------
  validate:
    name: 1. Validation Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérification du fichier compose
        run: docker compose config

  # ---------------------------------------------------
  # JOB 2 : Build des images et Publication Docker Hub
  # ---------------------------------------------------
  build-and-push:
    name: 2. Build & Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: validate
    # Le push ne se fait que sur la branche main (pas sur les Pull Requests)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push - Image API
      - name: Build & Push Image API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/churn-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/churn-api:${{ github.sha }}

      # Build & Push - Image Shiny App
      - name: Build & Push Image Shiny
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/interface-shiny:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/interface-shiny:${{ github.sha }}