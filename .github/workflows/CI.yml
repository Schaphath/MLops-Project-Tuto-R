name: CI Pipeline - Telco Churn 

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-validate:
    name: Validation Docker & Compose
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Validation de la syntaxe Docker Compose
        run: docker compose config

  build-and-scan:
    name: Build & Scan de Sécurité (Trivy)
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build de l'image API
      - name: Build de l'image Docker API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          load: true
          tags: churn-api:ci

      # Build de l'image Shiny
      - name: Build de l'image Docker Shiny
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          load: true
          tags: interface-shiny:ci

      # Scan de sécurité de l'API avec Trivy
      - name: Scan de sécurité de l'image API (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'churn-api:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Scan de sécurité de Shiny avec Trivy
      - name: Scan de sécurité de l'image Shiny (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'interface-shiny:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  integration-test:
    name: Test d'Intégration
    runs-on: ubuntu-latest
    needs: build-and-scan

    steps:
      - name: Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: Démarrage des conteneurs via Docker Compose
        run: docker compose up -d --build

      - name: Attente du statut Healthy des conteneurs
        run: |
          echo "Attente de l'initialisation des services..."
          timeout 60s bash -c '
            until [ "$(docker inspect --format="{{.State.Health.Status}}" telco-churn-api)" == "healthy" ] && \
                  [ "$(docker inspect --format="{{.State.Health.Status}}" telco-churn-interface)" == "healthy" ]; do
              sleep 2
            done
          '

      - name: Test d'inférence réel sur l'API (/predict)
        run: |
          curl -s -X POST "http://localhost:8080/predict" \
            -H "Content-Type: application/json" \
            -d '[{
              "gender": 1,
              "SeniorCitizen": 0,
              "Partner": 1,
              "Dependents": 0,
              "tenure": 12,
              "PhoneService": 1,
              "PaperlessBilling": 1,
              "MonthlyCharges": 65.5,
              "MultipleLines_No": 1,
              "InternetService_DSL": 1,
              "InternetService_Fiber_optic": 0,
              "Contract_Month_to_month": 1,
              "Contract_One_year": 0,
              "Contract_Two_year": 0,
              "PaymentMethod_Bank_transfer": 0,
              "PaymentMethod_Credit_card": 0,
              "PaymentMethod_Electronic_check": 1,
              "PaymentMethod_Mailed_check": 0,
              "ServiceSup_No": 0,
              "ServiceSup_Yes": 1,
              "No_Internet_Service": 0
            }]' | grep -E "churn_proba|decision"

      - name: Arrêt et nettoyage des conteneurs
        if: always()
        run: docker compose down -v
        